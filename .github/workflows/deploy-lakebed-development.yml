name: Deploy development to Lakebed

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lakebed-development
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy development capsule
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://almeida-fight-dev.lakebed.app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select development deploy
        env:
          LAKEBED_DEV_DEPLOY_ID: ${{ secrets.LAKEBED_DEV_DEPLOY_ID }}
        run: |
          if [ -z "$LAKEBED_DEV_DEPLOY_ID" ]; then
            echo "::error::Add a LAKEBED_DEV_DEPLOY_ID development environment secret before deploying."
            exit 1
          fi
          printf '{"deployId":"%s"}\n' "$LAKEBED_DEV_DEPLOY_ID" > lakebed.json

      - name: Verify Lakebed credential
        env:
          LAKEBED_TOKEN: ${{ secrets.LAKEBED_DEV_TOKEN }}
        run: |
          if [ -z "$LAKEBED_TOKEN" ]; then
            echo "::error::Add a LAKEBED_DEV_TOKEN development environment secret before deploying. Create it with: npx lakebed token create --name github-actions-development"
            exit 1
          fi

      - name: Deploy to Lakebed
        env:
          LAKEBED_TOKEN: ${{ secrets.LAKEBED_DEV_TOKEN }}
        run: npx --yes lakebed@0.0.29 deploy . --json
